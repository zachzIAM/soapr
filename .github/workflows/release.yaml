on:
  push:
    branches: [main]
  workflow_dispatch:

name: release

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.actor != 'github-actions[bot]' &&
      !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test release script
        run: python3 -m unittest discover -s .github/scripts -v

      - name: Calculate SemVer bump and update changelog
        id: release
        run: >-
          python3 .github/scripts/release.py
          --notes-output "${{ runner.temp }}/release_notes.md"

      - name: Commit, tag, and publish GitHub Release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DESCRIPTION NEWS.md
          git commit -m "chore(release): ${{ steps.release.outputs.tag }}"
          git tag -a "${{ steps.release.outputs.tag }}" -m "Release ${{ steps.release.outputs.tag }}"
          git push --atomic origin main "${{ steps.release.outputs.tag }}"
          gh release create "${{ steps.release.outputs.tag }}" \
            --title "${{ steps.release.outputs.tag }}" \
            --notes-file "${{ runner.temp }}/release_notes.md"
